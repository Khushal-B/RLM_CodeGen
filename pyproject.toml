[project]
name = "rlm-contracts"
version = "0.1.0"
description = "Contract-recursive Recursive Language Models for long-horizon repository generation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rlms>=0.1.3",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
metrics = ["tiktoken>=0.7.0"]
typecheck = ["mypy>=1.10.0"]

[project.scripts]
rlmc = "rlmc.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rlmc", "rlmc.*"]

[tool.setuptools.package-data]
"rlmc.bench" = ["smoke/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
